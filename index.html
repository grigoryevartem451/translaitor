<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>1161702</title>
</head>
<body>
    <input type="text" id="wordInput">
    <h1 id="translationHeader"></h1>

    <script>
        const dictionary = {
            "привет": "hello",
            "мир": "world",
            "кошка": "cat",
            "собака": "dog",
            "дом": "house",
            "солнце": "sun",
            "книга": "book",
            "яблоко": "apple"
        };

        const input = document.getElementById('wordInput');
        const header = document.getElementById('translationHeader');

        input.addEventListener('input', () => {
            const query = input.value.trim().toLowerCase();
            header.textContent = dictionary[query] || "";
        });
    </script>
</body>
</html>
